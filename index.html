<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医程 - 医疗记录管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Login Page -->
  <div class="login-page" id="loginPage">
    <div class="login-container">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <path d="M16 8v16M8 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="login-title">医程</h1>
      <p class="login-subtitle">医疗记录管理系统</p>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">登录</button>
        <p class="login-error" id="loginError"></p>
        <p class="login-toggle">还没有账号？<a href="#" id="showRegister">立即注册</a></p>
      </form>

      <form class="register-form" id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="regUsername">用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名（至少3位）" required minlength="3">
        </div>
        <div class="form-group">
          <label for="regPassword">密码</label>
          <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required minlength="6">
        </div>
        <div class="form-group">
          <label for="regConfirmPassword">确认密码</label>
          <input type="password" id="regConfirmPassword" placeholder="请再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">注册</button>
        <p class="login-error" id="registerError"></p>
        <p class="login-toggle">已有账号？<a href="#" id="showLogin">返回登录</a></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="mainApp" style="display: none;">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
            <path d="M16 8v16M8 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">医程</span>
        </div>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" class="search-input" placeholder="搜索医院、科室、诊断结果..." id="searchInput">
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" id="addRecordBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          添加记录
        </button>
        <span class="user-info" id="userInfo"></span>
        <button class="btn btn-ghost" id="settingsBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          设置
        </button>
        <button class="btn btn-ghost" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          退出
        </button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <nav class="nav">
          <a href="#" class="nav-item active" data-view="records">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
            </svg>
            <span>就医记录</span>
          </a>
          <a href="#" class="nav-item" data-view="photos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
            <span>照片库</span>
          </a>
          <a href="#" class="nav-item" data-view="stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18"/>
              <path d="m19 9-5 5-4-4-3 3"/>
            </svg>
            <span>健康趋势</span>
          </a>
        </nav>
        <div class="sidebar-stats">
          <h3>本月统计</h3>
          <div class="stat-item">
            <span class="stat-value" id="monthRecords">0</span>
            <span class="stat-label">就医次数</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="monthCost">¥0</span>
            <span class="stat-label">医疗支出</span>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="view active" id="recordsView">
          <div class="view-header">
            <h2 class="view-title">就医记录</h2>
            <div class="view-filters">
              <select class="filter-select" id="timeFilter">
                <option value="all">全部时间</option>
                <option value="week">近一周</option>
                <option value="month">近一月</option>
                <option value="quarter">近三月</option>
                <option value="halfyear">近半年</option>
                <option value="year">近一年</option>
              </select>
            </div>
          </div>
          <div class="records-list" id="recordsList"></div>
          <div class="empty-state" id="emptyState">
            <svg class="empty-illustration" viewBox="0 0 200 160">
              <circle cx="100" cy="80" r="60" fill="#F5F0EB"/>
              <rect x="85" y="50" width="30" height="60" rx="4" fill="#5B8A72" opacity="0.3"/>
              <rect x="90" y="60" width="20" height="4" rx="2" fill="#5B8A72"/>
              <rect x="90" y="70" width="15" height="3" rx="1.5" fill="#5B8A72" opacity="0.6"/>
              <rect x="90" y="78" width="18" height="3" rx="1.5" fill="#5B8A72" opacity="0.6"/>
            </svg>
            <h3 class="empty-title">还没有就医记录</h3>
            <p class="empty-desc">开始记录您的健康之旅吧</p>
            <button class="btn btn-primary" id="emptyAddBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              添加第一条记录
            </button>
          </div>
        </div>

        <div class="view" id="photosView">
          <div class="view-header">
            <h2 class="view-title">照片库</h2>
            <div class="filter-tags" id="photoTags">
              <button class="tag active" data-tag="all">全部</button>
              <button class="tag" data-tag="处方单">处方单</button>
              <button class="tag" data-tag="检查报告">检查报告</button>
              <button class="tag" data-tag="病历本">病历本</button>
              <button class="tag" data-tag="其他">其他</button>
            </div>
          </div>
          <div class="photos-grid" id="photosGrid"></div>
          <div class="empty-state" id="photosEmptyState"><p>还没有上传任何照片</p></div>
        </div>

        <div class="view" id="statsView">
          <div class="view-header"><h2 class="view-title">健康趋势</h2></div>
          <div class="stats-cards">
            <div class="stats-card">
              <h4>就医频次</h4>
              <div class="chart-placeholder"><div class="bar-chart" id="frequencyChart"></div></div>
            </div>
            <div class="stats-card">
              <h4>科室分布</h4>
              <div class="department-list" id="departmentList"></div>
            </div>
            <div class="stats-card">
              <h4>累计支出</h4>
              <div class="total-cost" id="totalCost">¥0</div>
              <p class="cost-hint">近一年医疗支出</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Record Modal -->
  <div class="modal" id="recordModal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h2 class="modal-title" id="modalTitle">添加就医记录</h2>
      <form class="record-form" id="recordForm">
        <input type="hidden" id="recordId">
        <div class="form-row">
          <div class="form-group">
            <label for="recordPatient">患者姓名 *</label>
            <input type="text" id="recordPatient" placeholder="如：张三" required>
          </div>
          <div class="form-group">
            <label for="recordDate">就诊日期 *</label>
            <input type="date" id="recordDate" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="recordHospital">医院名称 *</label>
            <input type="text" id="recordHospital" placeholder="如：北京协和医院" required>
          </div>
          <div class="form-group">
            <label for="recordDepartment">科室 *</label>
            <input type="text" id="recordDepartment" placeholder="如：心内科" required>
          </div>
        </div>
        <div class="form-group">
          <label for="recordDiagnosis">诊断结果 *</label>
          <input type="text" id="recordDiagnosis" placeholder="如：窦性心律不齐" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="recordDoctor">医生姓名</label>
            <input type="text" id="recordDoctor" placeholder="如：张主任">
          </div>
          <div class="form-group">
            <label for="recordCost">费用（元）</label>
            <input type="number" id="recordCost" step="0.01" min="0" placeholder="如：258.50">
          </div>
        </div>
        <div class="form-group">
          <label for="recordSymptoms">症状描述</label>
          <textarea id="recordSymptoms" rows="2" placeholder="如：偶有心悸"></textarea>
        </div>
        <div class="form-group">
          <label for="recordPrescription">医嘱</label>
          <textarea id="recordPrescription" rows="2" placeholder="如：清淡饮食"></textarea>
        </div>
        <div class="form-group">
          <label>检查图片</label>
          <div class="image-uploader" id="imageUploader">
            <div class="upload-area" id="uploadArea">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <p>拖拽图片或 <span class="upload-link">点击上传</span></p>
              <span class="upload-hint">支持 JPG、PNG，最多9张</span>
              <input type="file" id="imageInput" accept="image/*" multiple hidden>
            </div>
            <div class="image-preview" id="imagePreview"></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存记录</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Image Preview Modal -->
  <div class="modal image-preview-modal" id="imagePreviewModal">
    <div class="modal-backdrop"></div>
    <div class="modal-content image-modal">
      <button class="modal-close" id="imageModalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <img src="" alt="Preview" class="preview-image" id="previewImage">
      <button class="preview-nav prev" id="prevImage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="preview-nav next" id="nextImage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="preview-info" id="previewInfo"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal detail-modal" id="detailModal">
    <div class="modal-backdrop"></div>
    <div class="modal-content detail-modal">
      <button class="modal-close" id="detailModalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="detail-content" id="detailContent"></div>
      <div class="detail-actions">
        <button class="btn btn-secondary" id="editRecordBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          编辑
        </button>
        <button class="btn btn-danger" id="deleteRecordBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          删除
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="settingsModalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h2 class="modal-title">设置</h2>
      <form class="settings-form" id="changePasswordForm">
        <div class="form-group">
          <label for="oldPassword">原密码</label>
          <input type="password" id="oldPassword" placeholder="请输入原密码" required>
        </div>
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required>
        </div>
        <p class="password-error" id="passwordError"></p>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
          <button type="submit" class="btn btn-primary">修改密码</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"><span class="toast-message"></span></div>
  <script src="js/app.js"></script>
</body>
</html>
